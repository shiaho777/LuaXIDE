name: CI

# CI is the merge gate for PRs into main.
# It never closes Issues — Issues close via "Fixes #N" when the PR merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Latest run wins: superseded PR runs are cancelled to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: engine-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run engine tests (t1-t28)
        run: make -C engine test

  engine-js-tests:
    name: engine-js-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run QuickJS engine tests (j1-j6)
        run: make -C engine-js test

  engine-py-tests:
    name: engine-py-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run MicroPython engine tests (p1-p2)
        run: make -C engine-py test

  android-build:
    name: android-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # 'tools' no longer exists in the SDK repository for cmdline-tools 16+;
          # only install packages that still resolve.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Check :app/:runtime paired files are byte-identical
        run: ./scripts/check_sync.sh
      - name: Run UI policy unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Sync runtime template APK into app assets
        run: ./gradlew :runtime:syncRuntimeTemplate --stacktrace
      - name: Build debug APKs and Compose test APK
        run: ./gradlew :app:assembleDebug :runtime:assembleDebug :app:assembleDebugAndroidTest --stacktrace
